<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>ChatApp - Profile</title>

    <link
            rel="stylesheet"
            href="css/profile.css"
    >

</head>

<body>

<div class="profile-container">

    <!-- ================= HEADER ================= -->

    <header class="profile-header">

        <button
                id="backButton"
                class="back-button"
        >
            ←
        </button>

        <h2>Profile</h2>

    </header>


    <!-- ================= PROFILE ================= -->

    <main class="profile-content">

        <div class="profile-image-container">

            <img
                    id="profileImage"
                    src=""
                    alt="Profile"
            >

        </div>


        <h1 id="profileName">
            Loading...
        </h1>


        <p
                id="profilePhone"
                class="profile-phone"
        >
        </p>


        <!-- ================= DETAILS ================= -->

        <div class="profile-details">

            <div class="detail-row">

                <span class="detail-label">
                    User ID
                </span>

                <span
                        id="userId"
                        class="detail-value"
                >
                    -
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Name
                </span>

                <span
                        id="userName"
                        class="detail-value"
                >
                    -
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Phone Number
                </span>

                <span
                        id="phoneNumber"
                        class="detail-value"
                >
                    -
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Email
                </span>

                <span
                        id="email"
                        class="detail-value"
                >
                    -
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Joined
                </span>

                <span
                        id="createdAt"
                        class="detail-value"
                >
                    -
                </span>

            </div>

        </div>


        <!-- ================= EDIT BUTTON ================= -->

        <button
                id="editButton"
                class="edit-button"
        >
            Edit Profile
        </button>


        <!-- ================= EDIT FORM ================= -->

        <form
                id="editForm"
                class="edit-form"
                style="display: none;"
        >

            <h3>
                Edit Profile
            </h3>


            <label for="editName">
                Name
            </label>

            <input
                    type="text"
                    id="editName"
                    maxlength="100"
                    required
            >


            <label for="editEmail">
                Email
            </label>

            <input
                    type="email"
                    id="editEmail"
                    maxlength="255"
            >


            <p
                    id="editError"
                    class="edit-error"
            >
            </p>


            <p
                    id="editSuccess"
                    class="edit-success"
            >
            </p>


            <div class="edit-actions">

                <button
                        type="submit"
                        id="saveButton"
                >
                    Save Changes
                </button>


                <button
                        type="button"
                        id="cancelButton"
                >
                    Cancel
                </button>

            </div>

        </form>


        <!-- ================= LOGOUT ================= -->

        <button
                id="logoutButton"
                class="logout-button"
        >
            Logout
        </button>

    </main>

</div>


<script src="js/profile.js"></script>

</body>

</html>
